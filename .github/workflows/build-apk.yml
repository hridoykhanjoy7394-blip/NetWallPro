name: Build NetWallPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q NetWallPro_Android_Starter.zip -d extracted

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find extracted -name "gradlew" -type f

      - name: Make Gradle executable
        run: |
          chmod +x $(find extracted -name "gradlew" -type f | head -1)

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name "gradlew" -type f | head -1)")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find extracted -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetWallPro-APK
          path: extracted/**/build/outputs/apk/**/*.apk
