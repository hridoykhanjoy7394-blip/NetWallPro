name: Build NetWallPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q NetWallPro_Android_Starter.zip -d extracted

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find extracted -name "settings.gradle*" -o -name "build.gradle*"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name "settings.gradle*" -type f | head -1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find extracted -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetWallPro-APK
          path: extracted/**/build/outputs/apk/**/*.apk
